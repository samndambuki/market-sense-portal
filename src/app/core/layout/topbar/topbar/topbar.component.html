<header class="tb">
  <div class="tb-left">
    <button
      type="button"
      class="tb-icon-btn"
      (click)="onToggle()"
      aria-label="Toggle sidebar"
      title="Toggle sidebar"
    >
      <span class="material-icons" aria-hidden="true">menu</span>
    </button>
    <span class="tb-title">{{ "TITLE" | translate }}</span>
  </div>

  <div class="tb-right">
    <!-- LANGUAGE -->
    <div class="tb-menu-wrap">
      <button
        type="button"
        class="tb-pill"
        (click)="toggleLang()"
        [attr.aria-expanded]="langOpen"
        aria-haspopup="menu"
        aria-label="Change language"
      >
        <span class="material-icons tb-pill-icon" aria-hidden="true"
          >translate</span
        >
        <span class="uppercase">{{ currentLang.code }}</span>
        <span class="material-icons tb-chevron" aria-hidden="true"
          >expand_more</span
        >
      </button>

      @if (langOpen) {
        <div class="tb-menu" role="menu">
          @for (lang of languages; track lang.code) {
            <button
              type="button"
              role="menuitemradio"
              class="tb-menu-item"
              [class.tb-menu-item--active]="lang.code === currentLang.code"
              [attr.aria-checked]="lang.code === currentLang.code"
              (click)="switchLang(lang)"
            >
              {{ lang.label }}
              @if (lang.code === currentLang.code) {
                <span class="material-icons tb-check" aria-hidden="true"
                  >check</span
                >
              }
            </button>
          }
        </div>
      }
    </div>

    <span class="tb-divider" aria-hidden="true"></span>

    <!-- USER -->
    <div class="tb-menu-wrap">
      <button
        type="button"
        class="tb-user"
        (click)="toggleUser()"
        [attr.aria-expanded]="userOpen"
        aria-haspopup="menu"
      >
        <span class="tb-avatar" aria-hidden="true">{{ initials }}</span>
        <span class="tb-user-text">
          <span class="tb-user-name">{{ displayName }}</span>
          <span class="tb-user-role">{{ roleLabel }}</span>
        </span>
        <span class="material-icons tb-chevron" aria-hidden="true"
          >expand_more</span
        >
      </button>

      @if (userOpen) {
        <div class="tb-menu tb-menu--user" role="menu">
          <div class="tb-menu-header">
            <p class="tb-user-name">{{ displayName }}</p>
            @if (currentUser.email) {
              <p class="tb-menu-email">{{ currentUser.email }}</p>
            }
            <span class="tb-role-badge">{{ roleLabel }}</span>
          </div>
          <button
            type="button"
            role="menuitem"
            class="tb-menu-item tb-menu-item--danger"
            (click)="logout()"
          >
            <span class="material-icons tb-item-icon" aria-hidden="true"
              >logout</span
            >
            Log out
          </button>
        </div>
      }
    </div>
  </div>
</header>
