<aside class="sb" [class.sb--collapsed]="collapsed">
  <!-- BRAND -->
  <div class="sb-brand">
    <span class="sb-mark" aria-hidden="true">
      <svg width="13" height="13" viewBox="0 0 18 18" fill="none">
        <rect
          x="1"
          y="10"
          width="3.5"
          height="7"
          rx="1"
          fill="#fff"
          fill-opacity=".55"
        />
        <rect
          x="7.25"
          y="6"
          width="3.5"
          height="11"
          rx="1"
          fill="#fff"
          fill-opacity=".8"
        />
        <rect x="13.5" y="1" width="3.5" height="16" rx="1" fill="#fff" />
      </svg>
    </span>
    @if (!collapsed) {
      <span class="sb-brand-name" [attr.title]="'TITLE' | translate">
        MarketSense
      </span>
    }
  </div>

  <!-- NAV -->
  <nav class="sb-nav" aria-label="Main">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="sb-link--active"
        [routerLinkActiveOptions]="{ exact: !!item.exact }"
        #rla="routerLinkActive"
        [attr.aria-current]="rla.isActive ? 'page' : null"
        [attr.title]="
          collapsed
            ? item.translate
              ? (item.label | translate)
              : item.label
            : null
        "
        class="sb-link"
      >
        <span class="material-icons sb-icon" aria-hidden="true">{{
          item.icon
        }}</span>
        @if (!collapsed) {
          <span class="sb-label">{{
            item.translate ? (item.label | translate) : item.label
          }}</span>
        } @else {
          <span class="sr-only">{{
            item.translate ? (item.label | translate) : item.label
          }}</span>
        }
      </a>
    }
  </nav>
</aside>
