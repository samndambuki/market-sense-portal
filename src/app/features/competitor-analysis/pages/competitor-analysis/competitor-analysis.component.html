<div class="max-w-4xl mx-auto">
  <!-- header  -->
  <div class="mb-6">
    <h1 class="text-lg font-semibold text-gray-900">Competitor Analysis</h1>
    <p>Analyze competitor and market positioning using AI</p>
  </div>

  <!-- input card  -->
  <div class="bg-white shadow-sm border border-gray-200 rounded-xl p-5 mb-6">
    <div class="flex flex-col sm:flex-row gap-3">
      <!-- select -->
      <select
        [(ngModel)]="selectedMarket"
        [disabled]="loadingMarkets || loading"
        class="w-full border border-gray-300 rounded-md px-4 py-3 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 cursor-pointer"
      >
        <option class="cursor-pointer" value="" disabled>
          {{ loadingMarkets ? "Loading markets..." : "Select a market" }}
        </option>

        <option *ngFor="let market of markets" [value]="market.name">
          {{ market.name }}
        </option>
      </select>
    </div>
    <button
      [disabled]="loading"
      (click)="analyze()"
      class="bg-blue-600 hover:blue-700 text-white text-sm font-medium px-5 py-2 rounded-md transition disabled:opacity-50 mt-4 cursor-pointer"
    >
      Analyze
    </button>
    <div *ngIf="error" class="mt-3 text-sm text-red-600">
      {{ error }}
    </div>
  </div>
  <!-- loading  -->
  <div
    *ngIf="loading"
    class="bg-white border border-gray-200 rounded-xl p-5 animate-pulse"
  >
    <div class="h-4 bg-gray-200 rounded w-1/3 mb-4"></div>
    <div class="h-3 bg-gray-200 rounded mb-2"></div>
    <div class="h-3 bg-gray-200 rounded mb-2"></div>
    <div class="h-3 bg-gray-200 rounded w-5/6"></div>
  </div>

  <!-- result  -->
  <div
    *ngIf="analysis && !loading"
    class="bg-white shadow-sm border border-gray-200 rounded-xl p-6"
  >
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold text-gray-800">
        AI Competitor Insights
      </h3>
    </div>
    <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full"
      >AI generated</span
    >
    <div class="text-sm text-gray-600 leading-relaxed whitespace-pre-line mt-4">
      {{ analysis }}
    </div>
  </div>
</div>
